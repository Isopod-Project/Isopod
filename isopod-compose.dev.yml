version: '3.8'

services:
  isopod:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: isopod-dev
    restart: unless-stopped
    ports:
      - "8000:8000"  # Backend / API
      - "5173:5173"  # Frontend Dev Server (Vite)
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # Ensure this matches your CasaOS data directory
      - /DATA/AppData/isopod/servers:/DATA/AppData/isopod/servers
    environment:
      - SERVERS_DIR=/DATA/AppData/isopod/servers
      - GITHUB_REPO=Isopod-Project/Isopod
      - DEBUG=true
      # Extra origins allowed to call the API cross-origin (comma-separated). The Vite dev
      # server proxies /api, so it doesn't need an entry here.
      - ISOPOD_CORS_ORIGINS=${ISOPOD_CORS_ORIGINS:-}
      # CurseForge API key (https://console.curseforge.com), needed for CurseForge search and modpacks
      - CURSEFORGE_API_KEY=${CURSEFORGE_API_KEY:-}
    # This command starts BOTH the backend and the frontend dev server
    # We use '&' to run them in parallel
    command: >
      sh -c "cd frontend && npm run dev -- --host 0.0.0.0 & 
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
