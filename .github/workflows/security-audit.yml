name: Security Audit

# Dependency, static analysis, secret, container image, and workflow scans.
# Runs on PRs to main, when a release tag is pushed, and on demand. The
# github-releases skill requires a green run on main before a release is published.
# Each job fails on high/critical findings; see docs/security-audit.md for triage.
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-deps:
    name: Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: pip-audit
        run: pipx run pip-audit==2.10.1 -r backend/requirements.txt --desc

  js-deps:
    name: JavaScript dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # npm audit only reads package-lock.json, so the runner's own npm is enough and nothing is installed
      - name: Runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      # Dev dependencies run on developer machines and in CI, so they count too
      - name: All dependencies
        run: npm audit --audit-level=high

  static-analysis:
    name: Bandit (Python static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Report medium and above
        run: |
          {
            echo "## Bandit: medium severity and above"
            echo '```'
            pipx run bandit==1.9.4 -r backend -x backend/venv --severity-level medium -f txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on high severity
        run: pipx run bandit==1.9.4 -r backend -x backend/venv --severity-level high --confidence-level high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      # Results go to the Security tab; code scanning fails the PR check on new high alerts
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # PRs: their commits. Release tags: everything since the previous tag. Manual runs: all history.
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          elif [ "$EVENT" = "push" ] && PREV=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null); then
            RANGE="$PREV..$GITHUB_SHA"
          else
            RANGE="--all"
          fi
          echo "Scanning $RANGE"
          ./gitleaks git . --redact --no-banner --log-opts="$RANGE"

  container-image:
    name: Container image (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t isopod:audit .
      - name: Scan for fixable high and critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore.yaml --exit-code 1 isopod:audit

  workflows:
    name: Workflow hygiene (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: zizmor
        run: pipx run zizmor==1.31.1 --offline .github/workflows
