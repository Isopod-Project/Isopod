name: E2E on In review

# Fires when a card on Isopod Project #1 changes Status. Runs only when the new
# status is "In review". Issue branches are named after the issue number
# (see AGENTS.md), so the issue's branch is checked out and tested.
#
# This workflow only runs from the default branch, so it takes effect after merge.
on:
  projects_v2_item:
    types: [edited]

permissions:
  contents: read
  issues: read

jobs:
  e2e:
    if: >-
      github.event.changes.field_value.field_type == 'single_select' &&
      github.event.changes.field_value.to.name == 'In review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve issue number and branch
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ID: ${{ github.event.projects_v2_item.content_node_id }}
        run: |
          if [ -z "$NODE_ID" ] || [ "$NODE_ID" = "null" ]; then
            echo "Item is not linked to an issue (draft item); nothing to test."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUMBER=$(gh api graphql -f query='query($id:ID!){ node(id:$id){ ... on Issue { number } } }' -f id="$NODE_ID" --jq '.data.node.number')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out issue branch
        if: steps.issue.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.issue.outputs.number }}

      - uses: actions/setup-node@v4
        if: steps.issue.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.issue.outputs.skip == 'false'
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        if: steps.issue.outputs.skip == 'false'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        if: steps.issue.outputs.skip == 'false'
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always() && steps.issue.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-issue-${{ steps.issue.outputs.number }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
