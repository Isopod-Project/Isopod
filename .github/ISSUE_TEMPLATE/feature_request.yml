name: Feature request
description: Suggest something Isopod should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or goal, not the solution yet. "I run 5 servers and can't tell which ones have players" beats "add a player column".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Isopod to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Workarounds, or how other tools (Prism, Crafty, Pterodactyl, ...) do it.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
