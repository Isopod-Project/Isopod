version: '3.8'

services:
  isopod:
    build: .
    image: isopod:latest
    container_name: isopod
    privileged: true
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "25565-25585:25565-25585"
    volumes:
      # Minecraft server instances and worlds
      - /DATA/AppData/isopod/servers:/servers
      # Caches pulled Docker images (like itzg/minecraft-server) on host storage
      - /DATA/AppData/isopod/docker:/var/lib/docker
    environment:
      - SERVERS_DIR=/servers

