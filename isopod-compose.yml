name: isopod

services:
  isopod:
    build: .
    image: isopod:latest
    container_name: isopod
    privileged: true
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8000:8000"
      - "25565-25585:25565-25585"
      # Bedrock servers and Java cross-play (Geyser) use UDP
      - "19132-19152:19132-19152/udp"
    volumes:
      # Minecraft server instances and worlds
      - /DATA/AppData/isopod/servers:/servers
      # Caches pulled Docker images (like itzg/minecraft-server) on host storage
      - /DATA/AppData/isopod/docker:/var/lib/docker
    environment:
      - SERVERS_DIR=/servers
      # CurseForge API key (https://console.curseforge.com), needed for CurseForge search and modpacks
      - CURSEFORGE_API_KEY=${CURSEFORGE_API_KEY:-}
    labels:
      icon: "https://raw.githubusercontent.com/Isopod-Project/Isopod/main/assets/logo.png"
      title: "Isopod"
      description: "Modern Minecraft Server Manager"
      casaos_app_id: "isopod"

x-casaos:
  architectures:
    - amd64
    - arm64
  main: isopod
  author: Isopod-Project
  category: Utilities
  description:
    en_us: Modern, lightweight Minecraft instance manager with a sleek web dashboard.
  developer: Isopod-Project
  icon: https://raw.githubusercontent.com/Isopod-Project/Isopod/main/assets/logo.png
  thumbnail: https://raw.githubusercontent.com/Isopod-Project/Isopod/main/assets/logo.png
  title:
    en_us: Isopod
  port_map: "8000"
  scheme: http
